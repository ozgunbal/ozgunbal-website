name: Delete PR preview

# Deletes the PR's Cloud Run preview service once the PR is merged or closed.
# Preview images are removed by the Artifact Registry cleanup policy on the
# ozgunbal-website-preview package.

on:
  pull_request:
    types: [closed]

concurrency:
  # Same group as preview.yml, so a deploy still running for this PR is cancelled.
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ozgunbal-website-pr-${{ github.event.pull_request.number }}

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write # required for Workload Identity Federation

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Delete Cloud Run service
        run: |
          if gcloud run services describe "$SERVICE" --region "$REGION" >/dev/null 2>&1; then
            gcloud run services delete "$SERVICE" --region "$REGION" --quiet
          else
            echo "No preview service $SERVICE, nothing to delete."
          fi

      - name: Update preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- preview-url -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: `${marker}\n🧹 Preview deleted.` });
            }
